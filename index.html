<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Reading Room</title>
<style>
:root{color-scheme:light;--ink:#1e2b39;--muted:#536476;--paper:#f9fbfc;--line:#c8d3df;--blue:#2c4a66}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:clamp(16px,5vw,64px);background:#e8eef4;color:var(--ink);font:16px/1.55 system-ui,sans-serif}.reader{width:min(100%,920px);display:grid;grid-template-columns:1fr .92fr;background:var(--paper);border:1px solid #d7e0e9;border-radius:26px;overflow:hidden;box-shadow:0 24px 85px #2c4a6618}.welcome{padding:clamp(26px,6vw,78px);align-self:center}h1{margin:0;font:normal clamp(2.5rem,5vw,4.4rem)/.96 Georgia,serif;letter-spacing:-.055em}.intro{max-width:25ch;margin:1.25rem 0 2rem;color:var(--muted)}label{display:block;margin-bottom:.45rem;font-weight:650;font-size:.92rem}input,button{width:100%;min-height:51px;border-radius:10px;font:inherit}input{padding:.8rem 1rem;background:#fff;color:var(--ink);border:1px solid #a8b8c9}button{margin-top:.75rem;padding:.75rem 1rem;border:0;background:var(--blue);color:white;font-weight:650;cursor:pointer}button:hover{background:#203b56}button:disabled{opacity:.72;cursor:wait}:focus-visible{outline:3px solid #537eaa;outline-offset:3px}[role=status]{margin:.75rem 0 0;color:#783f35;font-size:.9rem}[role=status]:empty{display:none}.illustration{min-height:450px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 35% 26%,#446784,#243d55 78%)}.illustration::before{content:'';position:absolute;inset:22px;border:1px solid #c5d9e44a;border-radius:14px}.book{width:64%;max-width:260px;aspect-ratio:1.52;display:flex;position:relative;transform:rotate(-12deg);filter:drop-shadow(8px 19px 15px #0d1a2b66)}.leaf{width:50%;background:repeating-linear-gradient(180deg,transparent 0 12px,#93a6ba68 13px 14px,transparent 15px) center 26%/70% 65% no-repeat,linear-gradient(90deg,#eef4f9,#c8d7e4);border:1px solid #a6bbce;border-radius:8px 16px 3px 7px;transform:skewY(9deg);box-shadow:0 5px #9aafc3,0 9px #7190ac}.leaf+.leaf{background:repeating-linear-gradient(180deg,transparent 0 12px,#93a6ba68 13px 14px,transparent 15px) center 26%/70% 65% no-repeat,linear-gradient(90deg,#c8d7e4,#eef4f9);border-radius:16px 8px 7px 3px;transform:skewY(-9deg)}.ribbon{position:absolute;left:62%;top:69%;width:14px;height:39%;background:#dcb486;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}@media(max-width:640px){.reader{grid-template-columns:1fr}.illustration{min-height:158px;grid-row:1}.illustration::before{inset:12px}.book{width:118px}.welcome{padding:27px 23px 30px}.intro{max-width:none;margin:1rem 0 1.5rem}}
</style>
<main class="reader"><section class="welcome" aria-labelledby="title"><h1 id="title">Reading<br>Room</h1><p class="intro">Введите код доступа, чтобы открыть книгу.</p><form><label for="password">Код доступа</label><input id="password" type="text" inputmode="text" lang="ru" spellcheck="false" autocorrect="off" autocapitalize="none" autocomplete="off" required><button>Открыть книгу</button><p role="status" aria-live="polite"></p></form></section><div class="illustration" aria-hidden="true"><div class="book"><span class="leaf"></span><span class="leaf"></span><span class="ribbon"></span></div></div></main>
<script type="module">
const form = document.querySelector('form');
const input = document.querySelector('input');
const button = document.querySelector('button');
const status = document.querySelector('[role=status]');
const wrapped = Uint8Array.from(atob('5CEZfxfMn36Luz3wJNrAG1GvHWk5EfAEtx0XLICtAJUa2/rbZvEU0xAZN4eP9vVjVOODvRqr6IKSMYE9e14YRrADqJsWtsO3HC53ZA=='), c => c.charCodeAt(0));
async function decrypt(payload, password) {
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:payload.slice(0,16),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  return crypto.subtle.decrypt({name:'AES-GCM',iv:payload.slice(16,28)},key,payload.slice(28));
}
form.addEventListener('submit', async event => {
  event.preventDefault();
  button.disabled = true;
  status.textContent = 'Открываем книгу…';
  const password = input.value.trim();
  try {
    const unlocked = await decrypt(wrapped, password);
    const response = await fetch('./edition.bin');
    if (!response.ok) throw Error('Download failed');
    const payload = new Uint8Array(await response.arrayBuffer());
    const compressed = await decrypt(payload,new TextDecoder().decode(unlocked)).catch(() => decrypt(payload,password));
    input.value = '';
    const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    location.replace(URL.createObjectURL(await new Response(stream,{headers:{'Content-Type':'text/html;charset=utf-8'}}).blob()));
  } catch (error) {
    status.textContent = error.name === 'OperationError' ? 'Пароль не подошёл.' : 'Книга пока недоступна. Попробуйте ещё раз.';
    button.disabled = false;
  }
});
</script></html>
